# Pings Supabase once a day so a free project is not paused.
# Sends you a WhatsApp or email on every ping.
# When fewer than 5 days remain before GitHub turns this schedule off,
# the same message tells you to enable the workflow and run it again.
#
# GitHub disables a scheduled workflow after 60 days with no repository
# activity. The clock starts from the last time this workflow file changed
# or the workflow was enabled.

name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          ping() {
            curl -s -o /dev/null -w "%{http_code}" \
              -X GET \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Accept: application/json" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/apartments?select=id&limit=1"
          }

          ok=0
          for i in 1 2 3; do
            response=$(ping)
            echo "Ping $i: HTTP $response"
            if [ "$response" = "200" ] || [ "$response" = "206" ]; then
              ok=$((ok + 1))
            fi
            sleep 2
          done

          if [ "$ok" -eq 0 ]; then
            echo "Supabase ping failed"
            exit 1
          fi
          echo "Supabase ping successful ($ok/3)"

      - name: Message you about the ping
        env:
          GH_TOKEN: ${{ github.token }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          updated=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/keep-supabase-alive.yml" --jq .updated_at)
          updated_epoch=$(date -d "$updated" +%s)
          now=$(date +%s)
          age_days=$(( (now - updated_epoch) / 86400 ))
          days_left=$((60 - age_days))
          echo "Schedule age: ${age_days} days. Days left before GitHub turns it off: ${days_left}."

          when=$(date -u +"%Y-%m-%d %H:%M UTC")
          text="Supabase ping succeeded at ${when}."
          if [ "$days_left" -le 5 ]; then
            text="${text} The keepalive schedule ends in ${days_left} days. Open GitHub, Actions, Keep Supabase Alive, click Enable workflow, then Run workflow."
          fi

          sent=0

          if [ -n "$WHATSAPP_PHONE" ] && [ -n "$CALLMEBOT_APIKEY" ]; then
            curl -fsS -G "https://api.callmebot.com/whatsapp.php" \
              --data-urlencode "phone=${WHATSAPP_PHONE}" \
              --data-urlencode "text=${text}" \
              --data-urlencode "apikey=${CALLMEBOT_APIKEY}"
            echo
            echo "WhatsApp message sent."
            sent=1
          fi

          if [ -n "$NOTIFY_EMAIL" ] && [ -n "$RESEND_API_KEY" ]; then
            payload=$(NOTIFY_EMAIL="$NOTIFY_EMAIL" TEXT="$text" python3 -c 'import json,os; print(json.dumps({"from":"Supabase keepalive <onboarding@resend.dev>","to":[os.environ["NOTIFY_EMAIL"]],"subject":"Supabase keepalive","text":os.environ["TEXT"]}))')
            curl -fsS -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer ${RESEND_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$payload"
            echo
            echo "Email sent."
            sent=1
          fi

          if [ "$sent" -eq 0 ]; then
            echo "::warning::No message sent. Add WHATSAPP_PHONE and CALLMEBOT_APIKEY, or NOTIFY_EMAIL and RESEND_API_KEY."
            exit 1
          fi
